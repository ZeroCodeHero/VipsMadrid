<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- ========================================================================
       CLIENT CONFIG  —  THIS IS THE ONLY THING YOU EDIT PER CLIENT
       ------------------------------------------------------------------------
       Change the values below. Do NOT edit any other file.
       Any link left as "" hides its button.
       ======================================================================== -->
  <script>
    const CONFIG = {
      // 1. Business name — browser tab title + footer.
      BUSINESS_NAME: "VIPS Madrid",

      // 2. Google review link for ONE specific restaurant (optional).
      //    https://search.google.com/local/writereview?placeid=<PLACE_ID>
      //    VIPS has many Madrid locations — fill in the one this card is for.
      GOOGLE_REVIEW_LINK: "",

      // 3. Social profiles + website (open in a new tab).
      INSTAGRAM_LINK: "https://www.instagram.com/envips/",
      TIKTOK_LINK:    "https://www.tiktok.com/@envips",
      FACEBOOK_LINK:  "https://www.facebook.com/vips/",
      X_LINK:         "https://x.com/VIPS",
      YOUTUBE_LINK:   "https://www.youtube.com/@envips",
      WEBSITE_LINK:   "https://www.vips.es/"
    };
  </script>
  <!-- ===================== END CLIENT CONFIG ================================ -->

  <meta name="theme-color" content="#DD1B2D" />
  <title>VIPS Madrid</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>

  <main class="card">
    <header class="hero">
      <img class="logo" src="logo.svg" width="364" height="57" alt="VIPS" />

      <span class="eyebrow">Madrid</span>

      <h1 class="title">¡Gracias por venir!</h1>
      <p class="lede">Tortitas, burgers y buenos ratos. Síguenos para no perderte ninguna novedad.</p>
    </header>

    <nav class="actions" aria-label="Redes sociales de VIPS">
      <a id="review-link" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer" hidden>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2Z"/>
        </svg>
        <span class="btn-label">Déjanos tu reseña</span>

        <span class="btn-label">Síguenos en Instagram</span>
      </a>

      <div class="grid">
        <a id="tiktok-link" class="btn btn-ghost" href="#" target="_blank" rel="noopener noreferrer" hidden>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

        <a id="facebook-link" class="btn btn-ghost" href="#" target="_blank" rel="noopener noreferrer" hidden>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

        </a>

        <a id="youtube-link" class="btn btn-ghost" href="#" target="_blank" rel="noopener noreferrer" hidden>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8ZM9.75 15.02V8.98L15.5 12l-5.75 3.02Z"/>
          </svg>
          <span class="btn-label">YouTube</span>
        </a>
      </div>

      <a id="website-link" class="btn btn-outline" href="#" target="_blank" rel="noopener noreferrer" hidden>
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19"/><path d="M12 2.5c2.6 2.6 4 6 4 9.5s-1.4 6.9-4 9.5c-2.6-2.6-4-6-4-9.5s1.4-6.9 4-9.5Z"/>

        <span class="btn-label">Carta y pedidos en vips.es</span>

    <footer class="footer">
      <p id="footer-text">Nos vemos en VIPS</p>
    </footer>

  <script src="app.js"></script>

</html>
